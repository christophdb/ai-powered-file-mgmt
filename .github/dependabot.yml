version: 2
updates:
  # These repositories are slide decks: the only thing to keep current is the
  # Pages workflow. Monthly and grouped, so a round of action bumps arrives as
  # one pull request instead of one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
